<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fame Order System</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a2b4a; }
    h1 { color: #16325c; }
    .row { display: flex; gap: 10px; margin: 16px 0; }
    input, button { padding: 10px 12px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 15px; }
    button { background: #16325c; color: white; border: none; cursor: pointer; }
    button:hover { background: #1e4272; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { color: #64748b; text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
    .status { color: #16a34a; font-weight: 600; }
    .part { display: inline-block; background: #eef2ff; color: #4338ca; border-radius: 4px; padding: 1px 7px; font-size: 12px; }
    .muted { color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Fame Order System</h1>
  <p class="muted">Submit an order. The API publishes it to Kafka, and a separate consumer processes it. This table polls the consumer every 2 seconds.</p>

  <div class="row">
    <input id="item" placeholder="Item (e.g. keyboard)" value="keyboard">
    <input id="qty" type="number" value="1" min="1" style="width: 90px;">
    <button onclick="submitOrder()">Place order</button>
  </div>
  <p id="msg" class="muted"></p>

  <h3>Processed orders <span id="count" class="muted"></span></h3>
  <table>
    <thead>
      <tr><th>Order ID</th><th>Item</th><th>Qty</th><th>Status</th><th>Partition</th><th>Processed</th></tr>
    </thead>
    <tbody id="orders"></tbody>
  </table>

  <script>
    async function submitOrder() {
      const item = document.getElementById("item").value;
      const quantity = parseInt(document.getElementById("qty").value, 10);
      const msg = document.getElementById("msg");
      msg.textContent = "Publishing...";
      try {
        const res = await fetch("/api/orders", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ item, quantity })
        });
        const data = await res.json();
        msg.textContent = "Accepted: " + data.order.id + " (published to Kafka)";
      } catch (e) {
        msg.textContent = "Error: " + e.message;
      }
    }

    async function refresh() {
      try {
        const res = await fetch("/consumer/orders");
        const data = await res.json();
        document.getElementById("count").textContent = "(" + data.count + ")";
        document.getElementById("orders").innerHTML = data.orders.map(function (o) {
          return "<tr><td>" + o.id + "</td><td>" + o.item + "</td><td>" + o.quantity +
            "</td><td class='status'>" + o.status + "</td><td><span class='part'>p" + o.partition +
            "</span></td><td class='muted'>" + new Date(o.processedAt).toLocaleTimeString() + "</td></tr>";
        }).join("");
      } catch (e) {
        // consumer not reachable yet, ignore
      }
    }

    setInterval(refresh, 2000);
    refresh();
  </script>
</body>
</html>
